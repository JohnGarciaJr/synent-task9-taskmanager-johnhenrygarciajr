{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Edit Task</h2>

<form method="POST">
    <div class="mb-3">
        <label for="title" class="form-label">Task Title</label>
        <input type="text" id="title" name="title" class="form-control" value="{{ task.title }}" required>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" class="form-control" rows="3">{{ task.description }}</textarea>
    </div>

    <!-- PRIORITY DROPDOWN -->
    <div class="mb-3">
        <label for="priority" class="form-label">Priority</label>
        <select id="priority" name="priority" class="form-select">
            <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
            <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
            <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="due_date" class="form-label">Due Date</label>
        <input type="date" id="due_date" name="due_date" class="form-control" placeholder="Select a date"
            value="{{ task.due_date }}">
    </div>

    <button class="btn btn-primary">Update Task</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
</form>

{% endblock %}
